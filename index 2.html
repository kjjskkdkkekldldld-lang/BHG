<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BHG DICE | ELITE</title>
    <style>
        body {
            margin: 0; background: #020617;
            font-family: 'Outfit', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; color: white; overflow: hidden;
        }

        .star { position: absolute; background: white; border-radius: 50%; animation: fall linear infinite; opacity: 0.3; }
        @keyframes fall { from { transform: translateY(-10vh); } to { transform: translateY(110vh); } }

        /* Başlık Orta-Büyük */
        h1 { font-size: 3.5rem; margin-bottom: 2.5rem; z-index: 2; }

        /* Seçenekler Orta-Büyük */
        .controls { display: flex; gap: 20px; margin-bottom: 40px; z-index: 2; }
        .mode-btn { 
            padding: 18px 35px; font-size: 1.5rem; border-radius: 15px; 
            border: 2px solid #38bdf8; background: transparent; 
            color: #38bdf8; cursor: pointer; transition: 0.3s;
        }
        .mode-btn:hover { background: #38bdf8; color: black; }

        /* Zarlar Orta-Büyük */
        #cubeContainer { display: flex; gap: 25px; justify-content: center; z-index: 2; }
        .cube { 
            width: 110px; height: 110px; border-radius: 25px;
            background: #1e293b; border: 3px solid #38bdf8;
            transition: all 0.2s ease; box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        /* Roll Butonu Orta-Büyük */
        .roll-btn { 
            margin-top: 60px; padding: 20px 80px; font-size: 1.8rem; font-weight: bold; 
            background: #38bdf8; color: black; border-radius: 50px; border: none; cursor: pointer; z-index: 2;
        }
        
        .shake-impact { animation: impact 0.3s ease-out; }
        @keyframes impact { 50% { transform: scale(1.1); } }
    </style>
</head>
<body>

    <div id="stars"></div>
    <h1>BHG DICE</h1>

    <div class="controls">
        <button class="mode-btn" onclick="setMode(1)">1</button>
        <button class="mode-btn" onclick="setMode(2)">2</button>
        <button class="mode-btn" onclick="setMode(3)">3</button>
        <button class="mode-btn" onclick="setMode(4)">4</button>
    </div>

    <div id="cubeContainer"></div>
    <button class="roll-btn" onclick="rollDice()">ROLL</button>

    <script>
        const colors = ['#f43f5e', '#fbbf24', '#22c55e', '#8b5cf6', '#06b6d4', '#f97316'];
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSimpleSound() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.value = 440;
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }

        function setMode(num) {
            const container = document.getElementById('cubeContainer');
            container.innerHTML = ''; 
            for(let i=0; i<num; i++) {
                const cube = document.createElement('div');
                cube.className = 'cube';
                container.appendChild(cube);
            }
        }
        
        function rollDice() {
            playSimpleSound();
            document.querySelectorAll('.cube').forEach(cube => {
                cube.classList.add('shake-impact');
                setTimeout(() => {
                    cube.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    cube.classList.remove('shake-impact');
                }, 300);
            });
        }

        for(let i=0; i<40; i++) {
            const s = document.createElement('div');
            s.className = 'star';
            s.style.width = s.style.height = Math.random()*2 + 'px';
            s.style.left = Math.random()*100 + '%';
            s.style.animationDuration = Math.random()*5 + 5 + 's';
            document.getElementById('stars').appendChild(s);
        }
        setMode(4);
    </script>
</body>
</html>
